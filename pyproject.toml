[project]
name = "visual-inspection"
version = "0.1.0"
description = "정상 이미지만으로 제조 불량을 찾고 위치를 짚기"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.0",
    "torchvision>=0.15",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
]
